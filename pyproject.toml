[project]
name = "capstone-prompt-injection"
version = "0.1.0"
description = "Comparative evaluation of prompt injection defenses for enterprise AI agent deployments"
authors = [{ name = "Boglarka Petruska" }]
requires-python = ">=3.11,<3.13"

dependencies = [
    # Data and analysis
    "pandas>=2.0",
    "numpy>=2.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    # Plotting
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # HuggingFace
    "datasets>=3.0",
    "huggingface-hub>=0.24",
    "transformers>=4.40",
    "torch>=2.0",
    "safetensors>=0.4",
    "tokenizers>=0.20",
    "sentencepiece>=0.2",
    "protobuf>=4.0",
    # Notebook and utility
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.65",
    "tabulate>=0.9",
    # Language detection for the 200-row label audit cross-language analysis
    "langdetect>=1.0",
]

[project.optional-dependencies]
# API clients used by Defense B agent and judge classes.
# - anthropic: ClaudeJudge (Sonnet 4.6 and Opus 4.7) and HaikuJudge (Haiku 4.5)
#   in src/defense_b/judge.py, used for v1.21 and v1.25 rubrics.
# - openai: GPT4oJudge (GPT-4o sensitivity, GPT-4o-mini cost-sweep).
#   Also used to talk to Together AI and OpenRouter, both of which expose
#   OpenAI-compatible endpoints.
# - groq: GroqAgent in src/defense_b/agent.py. Historical (Phase 1
#   sneak-preview only); production work after the Groq quota was exhausted
#   moved to Together AI. Kept here for reproducibility of the sneak-preview
#   results.
api = [
    "anthropic>=0.40",
    "openai>=1.50",
    "groq>=0.10",
]

# AgentDojo action-level evaluation (Section 5.9 of the final report). The
# evaluation was de-scoped after the Together AI FP8-tier function-call
# hallucination issue, but the code is preserved for reproducibility. Install
# this extra to run the AgentDojo workflow at src/defense_b/agentdojo_integration.py
# and scripts/run_agentdojo_eval.py.
agentdojo = [
    "agentdojo>=0.1",
]

[tool.uv]
package = false
